<div *ngIf="open" class="md:hidden fixed inset-0 z-50 flex items-end" role="dialog" aria-modal="true"
    aria-label="Profile">
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm animate-fade-in" (click)="close.emit()"></div>

    <div class="relative w-full bg-surface-light dark:bg-surface-dark border-t border-slate-200 dark:border-surface-muted rounded-t-[28px] shadow-2xl z-10 animate-slide-up overflow-hidden"
        style="padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));" (click)="$event.stopPropagation()">

        <!-- Drag handle -->
        <div class="flex justify-center pt-3.5 pb-1">
            <span class="w-10 h-1.5 rounded-full bg-slate-200 dark:bg-surface-muted"></span>
        </div>

        <!-- Close -->
        <button (click)="close.emit()" aria-label="Close profile menu"
            class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center text-slate-400 hover:text-slate-700 dark:hover:text-slate-100 bg-slate-100/80 dark:bg-black/20 hover:bg-slate-200 dark:hover:bg-surface-muted rounded-full transition-colors z-10">
            <mat-icon class="scale-90">close</mat-icon>
        </button>

        <!-- Profile header -->
        <a [routerLink]="['/profile']" (click)="close.emit()"
            class="block px-6 pt-4 pb-6 bg-gradient-to-br from-primary/10 via-accent/5 to-transparent dark:from-primary/15 dark:via-accent/10 no-underline">
            <div class="flex items-center gap-4">
                <img *ngIf="userProfilePic" [src]="userProfilePic" alt="Profile" (error)="photoError.emit()"
                    class="w-16 h-16 rounded-2xl object-cover ring-4 ring-white dark:ring-surface-dark shadow-lg shrink-0" />
                <div *ngIf="!userProfilePic"
                    class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-accent-light to-accent flex items-center justify-center font-bold text-white text-xl ring-4 ring-white dark:ring-surface-dark shadow-lg shrink-0">
                    {{ userName.substring(0, 2) | uppercase }}
                </div>
                <div class="flex flex-col min-w-0 gap-1 flex-1">
                    <span class="text-lg font-bold text-slate-900 dark:text-white truncate leading-tight">{{
                        userName }}</span>
                    <span
                        class="inline-flex items-center gap-1 w-fit text-[10px] font-semibold uppercase tracking-wide text-primary bg-primary/10 dark:bg-primary/15 rounded-full px-2 py-0.5">
                        <mat-icon class="!text-[12px] !w-3 !h-3">bolt</mat-icon>
                        ApplyFlow account
                    </span>
                </div>
                <mat-icon class="scale-75 text-slate-300 dark:text-slate-600 shrink-0">chevron_right</mat-icon>
            </div>
        </a>

        <div class="px-5 pt-5 space-y-6">
            <!-- Preferences -->
            <div class="space-y-2.5">
                <div class="flex items-center gap-1.5 px-1">
                    <mat-icon class="scale-75 text-slate-400">tune</mat-icon>
                    <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Preferences</span>
                </div>

                <app-theme-toggle [isDark]="isDark" (toggle)="toggleTheme.emit()"></app-theme-toggle>
            </div>

            <!-- Full profile link -->
            <a [routerLink]="['/profile']" (click)="close.emit()"
                class="flex items-center gap-3 p-3 rounded-2xl border border-slate-200 dark:border-surface-muted hover:bg-slate-50 dark:hover:bg-surface-muted/40 transition-all no-underline">
                <div
                    class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-surface-muted flex items-center justify-center shrink-0">
                    <mat-icon class="scale-90 text-slate-500 dark:text-slate-300">person</mat-icon>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-xs font-semibold text-slate-800 dark:text-slate-100">View Profile</p>
                    <p class="text-[11px] text-slate-500 dark:text-slate-400 truncate">Account details &amp; delete
                        account</p>
                </div>
                <mat-icon class="scale-75 text-slate-300 dark:text-slate-600 shrink-0">chevron_right</mat-icon>
            </a>
        </div>
    </div>
</div>
