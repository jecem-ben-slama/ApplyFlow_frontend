<aside
    [class]="'hidden md:flex shrink-0 transition-all duration-200 ease-in-out h-screen border-r border-slate-200/80 dark:border-surface-muted bg-background-light dark:bg-background-dark flex-col justify-between sticky top-0 text-slate-700 dark:text-slate-200 shadow-sm ' + (collapsed ? 'w-16' : 'w-64')">

    <div class="space-y-6 overflow-hidden">
        <!-- Logo & Collapse Button -->
        <div class="flex items-center justify-between px-3.5 pt-4">
            <div class="flex items-center gap-3 min-w-0">
                <app-logo class="w-8 h-8 rounded-xl overflow-hidden shrink-0 shadow-md shadow-primary/25"></app-logo>
                <span
                    [class]="'text-sm font-bold text-slate-900 dark:text-white tracking-wide whitespace-nowrap transition-all duration-200 ' + (collapsed ? 'opacity-0 w-0 overflow-hidden' : 'opacity-100')">
                    ApplyFlow
                </span>
            </div>

            <button *ngIf="!collapsed" (click)="onToggleCollapseClick()"
                class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-surface-dark rounded-xl p-1.5 transition-all shrink-0"
                aria-label="Collapse sidebar">
                <mat-icon class="scale-90">chevron_left</mat-icon>
            </button>
        </div>

        <div *ngIf="collapsed" class="flex justify-center px-2">
            <button (click)="onToggleCollapseClick()"
                class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-surface-dark rounded-xl p-1.5 transition-all"
                aria-label="Expand sidebar">
                <mat-icon class="scale-90">chevron_right</mat-icon>
            </button>
        </div>

        <div class="px-3">
            <app-sidebar-nav [collapsed]="collapsed"></app-sidebar-nav>
        </div>
    </div>

    <!-- Guest mode banner — nudges conversion, hidden once collapsed to avoid crowding -->
    <div *ngIf="isGuest && !collapsed" class="mx-3 mb-2">
        <button (click)="signIn.emit()"
            class="w-full flex items-center gap-2 p-2.5 rounded-xl bg-primary/10 dark:bg-primary/15 hover:bg-primary/15 dark:hover:bg-primary/20 border border-primary/20 transition-all text-left">
            <mat-icon class="scale-90 text-primary shrink-0">person_add</mat-icon>
            <span class="flex-1 min-w-0">
                <span class="block text-xs font-semibold text-primary leading-tight">Guest session</span>
                <span class="block text-[10px] text-primary/80 leading-tight">Sign in to save your data</span>
            </span>
        </button>
    </div>

    <div *ngIf="isGuest && collapsed" class="flex justify-center px-2 mb-2">
        <button (click)="signIn.emit()" class="text-primary hover:bg-primary/10 rounded-xl p-1.5 transition-all"
            aria-label="Sign in to save your data">
            <mat-icon class="scale-90">person_add</mat-icon>
        </button>
    </div>

    <!-- User / Profile Footer -->
    <div class="relative pt-3 border-t border-slate-200/80 dark:border-surface-muted mx-3 mb-3">

        <!-- Quick settings: theme toggle + profile link, sits flush above the footer row -->
        <div *ngIf="isProfileOpen"
            class="space-y-1 pb-3 mb-3 border-b border-slate-200/80 dark:border-surface-muted animate-fade-in"
            role="dialog" aria-modal="false" aria-label="Quick settings" (click)="$event.stopPropagation()">

            <app-theme-toggle [isDark]="isDark" (toggle)="toggleTheme.emit()"></app-theme-toggle>

            <a *ngIf="!isGuest" [routerLink]="['/profile']" (click)="closeProfileMenu()"
                class="flex items-center gap-2 p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-surface-dark transition-all no-underline">
                <mat-icon class="scale-90 text-slate-400 dark:text-slate-500">person</mat-icon>
                <span class="text-xs font-semibold text-slate-800 dark:text-slate-100 flex-1">View
                    Profile</span>
                <mat-icon class="scale-75 text-slate-300 dark:text-slate-600">chevron_right</mat-icon>
            </a>

            <button *ngIf="isGuest" (click)="signIn.emit(); closeProfileMenu()"
                class="w-full flex items-center gap-2 p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-surface-dark transition-all text-left">
                <mat-icon class="scale-90 text-slate-400 dark:text-slate-500">login</mat-icon>
                <span class="text-xs font-semibold text-slate-800 dark:text-slate-100 flex-1">Sign in with
                    Google</span>
                <mat-icon class="scale-75 text-slate-300 dark:text-slate-600">chevron_right</mat-icon>
            </button>
        </div>

        <div [class]="'flex items-center gap-2 p-1.5 ' + (collapsed ? 'justify-center flex-col' : '')">

            <img *ngIf="userProfilePic" [src]="userProfilePic" alt="Profile picture" (error)="photoError.emit()"
                class="w-8 h-8 rounded-full object-cover border border-slate-200 dark:border-slate-700 shrink-0 shadow-xs" />

            <div *ngIf="!userProfilePic"
                class="w-8 h-8 rounded-full bg-gradient-to-tr from-accent-light to-accent flex items-center justify-center font-bold text-white text-[10px] shrink-0 shadow-xs">
                {{ userName.substring(0, 2) | uppercase }}
            </div>

            <span *ngIf="!collapsed" class="flex-1 min-w-0 flex items-center gap-1.5">
                <span class="text-xs font-semibold text-slate-800 dark:text-slate-200 truncate leading-none">
                    {{ userName }}
                </span>
                <span *ngIf="isGuest"
                    class="shrink-0 text-[9px] font-bold uppercase tracking-wide text-primary bg-primary/10 dark:bg-primary/15 rounded-full px-1.5 py-0.5 leading-none">
                    Guest
                </span>
            </span>

            <!-- Gear / quick preferences (theme toggle + link to full profile) -->
            <button (click)="$event.stopPropagation(); onGearClick()"
                class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-surface-dark rounded-xl p-1.5 transition-all"
                aria-haspopup="dialog" [attr.aria-expanded]="isProfileOpen" aria-label="Open quick settings">
                <mat-icon class="scale-95">settings</mat-icon>
            </button>

            <!-- Logout -->
            <button (click)="logout.emit()"
                class="text-slate-400 hover:text-danger dark:hover:text-danger-textDark hover:bg-danger-bgLight dark:hover:bg-danger-bgDark/30 rounded-xl p-1.5 transition-all"
                aria-label="Sign out">
                <mat-icon class="scale-95">logout</mat-icon>
            </button>
        </div>
    </div>
</aside>
