<!-- Desktop -->
<app-sidebar-desktop [collapsed]="isCollapsed" (collapsedChange)="isCollapsed = $event" [userName]="userName"
    [userProfilePic]="userProfilePic" [isDark]="!!(isDarkMode$ | async)" (toggleTheme)="toggleTheme()"
    (logout)="requestLogout()" (photoError)="onPhotoError()">
</app-sidebar-desktop>

<!-- Mobile: FAB + slide-out drawer -->
<app-mobile-sidebar [userName]="userName" [userProfilePic]="userProfilePic" [isDark]="!!(isDarkMode$ | async)"
    (toggleTheme)="toggleTheme()" (logout)="requestLogout()" (photoError)="onPhotoError()">
</app-mobile-sidebar>

<!-- Shared logout confirmation (desktop + mobile) -->
<app-logout-confirm-dialog [open]="isConfirmLogoutOpen" (confirm)="confirmLogout()" (cancel)="cancelLogout()">
</app-logout-confirm-dialog>
