<div class="p-4 sm:p-8 max-w-7xl mx-auto space-y-8">

    <app-toast-container></app-toast-container>
    <!-- Toasts -->
   <!--  <div class="fixed top-4 right-4 z-[60] flex flex-col gap-2 w-[calc(100%-2rem)] max-w-sm" aria-live="polite">
        <div *ngFor="let toast of toasts" role="status"
            class="rounded-2xl px-4 py-3.5 shadow-xl border text-sm flex items-start justify-between gap-3 backdrop-blur-md animate-fade-in transition-all"
            [ngClass]="toast.type === 'success'
                ? 'bg-success-bgLight/90 dark:bg-emerald-950/90 border-emerald-200 dark:border-emerald-900 text-success-textLight dark:text-emerald-200'
                : 'bg-danger-bgLight/90 dark:bg-red-950/90 border-rose-200 dark:border-rose-900 text-danger-textLight dark:text-rose-200'">
            <span class="flex-1 font-medium leading-relaxed">{{ toast.message }}</span>
            <button type="button" (click)="dismissToast(toast.id)" aria-label="Dismiss notification"
                class="shrink-0 opacity-60 hover:opacity-100 transition leading-none p-1">✕</button>
        </div>
    </div> -->

    <!-- Header & Action Row -->
    <div
        class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-6 border-b border-slate-200 dark:border-surface-muted">
        <div>
            <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-slate-100 tracking-tight">
                Applications
            </h2>
            <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">
                Track, manage and automate your job applications workflow
            </p>
        </div>

        <!-- Create Button (Responsive for both Desktop & Mobile) -->
        <button [disabled]="isLoading"
            class="w-full sm:w-auto bg-primary hover:bg-primary-hover active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100 text-white font-medium py-2.5 px-5 rounded-xl shadow-sm transition-all duration-200 text-sm flex items-center justify-center gap-2 shrink-0"
            (click)="openCreateModal()">
            <span *ngIf="!isLoading">+ Compile New Application</span>
            <span *ngIf="isLoading" class="flex items-center justify-center gap-2">
                <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
                Loading ...
            </span>
        </button>
    </div>

    <!-- Filters bar -->
    <div
        class="bg-surface-light/80 dark:bg-surface-dark/80 backdrop-blur-md border border-slate-200 dark:border-surface-muted rounded-2xl shadow-sm animate-fade-in overflow-hidden">

        <!-- Mobile filter toggle -->
        <button type="button" (click)="filtersOpen = !filtersOpen"
            class="sm:hidden w-full flex items-center justify-between px-4 py-3.5 text-sm font-medium text-slate-700 dark:text-slate-200">
            <span class="flex items-center gap-2">
                <svg class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 4.5h18M6 9h12M10 13.5h4M11.25 18h1.5" />
                </svg>
                Filters
                <span *ngIf="hasActiveFilters"
                    class="h-5 min-w-5 px-1 rounded-full bg-primary text-white text-[10px] font-bold flex items-center justify-center">
                    {{ activeFilterCount }}
                </span>
            </span>
            <svg class="h-4 w-4 text-slate-400 transition-transform" [class.rotate-180]="filtersOpen" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
        </button>

        <div class="p-4 sm:p-5 sm:pt-5 flex flex-col sm:flex-row gap-4 items-end" [class.hidden]="!filtersOpen"
            [ngClass]="{'sm:flex': true, 'hidden': !filtersOpen}">
            <div class="flex-1 w-full">
                <label
                    class="text-[10px] font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-widest block mb-1.5">
                    Keyword
                </label>
                <input type="text" [(ngModel)]="filterKeyword" placeholder="Search company or job title..."
                    (ngModelChange)="onFilterInput()"
                    class="w-full rounded-xl border border-slate-200 dark:border-surface-muted px-3.5 py-2.5 text-sm min-h-11
                    focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary
                    bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 transition-all shadow-sm" />
            </div>

            <div class="w-full sm:w-48">
                <label
                    class="text-[10px] font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-widest block mb-1.5">
                    Status
                </label>

                <!-- Desktop select -->
                <div class="hidden sm:block">
                    <select [(ngModel)]="filterStatus" (ngModelChange)="onFilterInput()"
                        class="w-full rounded-xl border border-slate-200 dark:border-surface-muted px-3.5 py-2.5 text-sm
                        focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary
                        bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 transition-all shadow-sm">
                        <option value="">All</option>
                        <option value="COMPILED">Compiled</option>
                        <option value="SENT">Sent</option>
                        <option value="INTERVIEWING">Interviewing</option>
                        <option value="REJECTED">Rejected</option>
                    </select>
                </div>

                <!-- Mobile pill chips -->
                <div class="sm:hidden flex gap-2 overflow-x-auto pb-1 -mx-1 px-1">
                    <button type="button" *ngFor="let opt of statusOptions"
                        (click)="filterStatus = opt.value; onFilterInput()"
                        class="shrink-0 px-3 py-2 rounded-full text-xs font-semibold border transition-all min-h-9"
                        [ngClass]="filterStatus === opt.value
                            ? 'bg-primary text-white border-primary'
                            : 'bg-background-light dark:bg-background-dark border-slate-200 dark:border-surface-muted text-slate-600 dark:text-slate-300'">
                        {{ opt.label }}
                    </button>
                </div>
            </div>

            <button *ngIf="hasActiveFilters" type="button" (click)="clearFilters()"
                class="w-full sm:w-auto text-xs font-medium px-4 py-2.5 min-h-11 rounded-xl border border-slate-200 dark:border-surface-muted text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-surface-muted transition whitespace-nowrap shadow-sm">
                ✕ Clear filters
            </button>
        </div>
    </div>

    <!-- Persistent error banner -->
    <div *ngIf="errorMessage" role="alert"
        class="p-4 rounded-2xl bg-danger-bgLight dark:bg-red-950/40 border border-rose-200 dark:border-rose-900 text-danger-textLight dark:text-red-300 text-xs shadow-sm">
        {{ errorMessage }}
    </div>

    <!-- Data area -->
    <ng-container *ngIf="isLoading">
        <div
            class="rounded-2xl border border-slate-200 dark:border-surface-muted bg-surface-light/70 dark:bg-surface-dark/40 p-4 sm:p-6 shadow-sm">
            <div class="space-y-4">
                <app-skeleton type="table" [itemsCount]="5" class="hidden md:block"></app-skeleton>
                <app-skeleton type="card" [itemsCount]="3" class="block md:hidden"></app-skeleton>
            </div>
        </div>
    </ng-container>

    <ng-container *ngIf="!isLoading">

        <div class="relative">
            <!-- Lightweight overlay -->
            <div *ngIf="isRefreshing"
                class="absolute inset-0 bg-surface-light/60 dark:bg-surface-dark/60 backdrop-blur-[2px] z-10 flex items-start justify-center pt-12 rounded-2xl">
                <span
                    class="inline-flex items-center gap-2 text-xs font-medium text-slate-600 dark:text-slate-300 bg-surface-light dark:bg-surface-dark px-4 py-2 rounded-full shadow-lg border border-slate-200 dark:border-surface-muted">
                    <svg class="animate-spin h-3.5 w-3.5 text-primary" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    Updating…
                </span>
            </div>

            <!-- Table for desktop -->
            <div *ngIf="appPage?.content?.length"
                class="hidden md:block bg-surface-light dark:bg-surface-dark rounded-2xl shadow-sm border border-slate-200 dark:border-surface-muted overflow-hidden">
                <table class="min-w-full text-left text-sm">
                    <thead
                        class="bg-background-light dark:bg-surface-muted/30 text-[11px] uppercase tracking-wider text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-surface-muted">
                        <tr>
                            <th class="px-6 py-4">
                                <button type="button" (click)="onSortChange('companyName')"
                                    class="flex items-center gap-1.5 hover:text-slate-900 dark:hover:text-slate-100 transition font-semibold">
                                    Company <span class="text-primary font-mono">{{ sortIndicator('companyName')
                                        }}</span>
                                </button>
                            </th>
                            <th class="px-6 py-4">
                                <button type="button" (click)="onSortChange('jobTitle')"
                                    class="flex items-center gap-1.5 hover:text-slate-900 dark:hover:text-slate-100 transition font-semibold">
                                    Job Title <span class="text-primary font-mono">{{ sortIndicator('jobTitle')
                                        }}</span>
                                </button>
                            </th>
                            <th class="px-6 py-4">
                                <button type="button" (click)="onSortChange('dateApplied')"
                                    class="flex items-center gap-1.5 hover:text-slate-900 dark:hover:text-slate-100 transition font-semibold">
                                    Date <span class="text-primary font-mono">{{ sortIndicator('dateApplied') }}</span>
                                </button>
                            </th>
                            <th class="px-6 py-4 font-semibold">Language</th>
                            <th class="px-6 py-4">
                                <button type="button" (click)="onSortChange('status')"
                                    class="flex items-center gap-1.5 hover:text-slate-900 dark:hover:text-slate-100 transition font-semibold">
                                    Status <span class="text-primary font-mono">{{ sortIndicator('status') }}</span>
                                </button>
                            </th>
                            <th class="px-6 py-4 text-right font-semibold">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 dark:divide-surface-muted/60">
                        <ng-container *ngFor="let app of appPage!.content">
                            <tr app-application-row
                                class="hover:bg-slate-50/80 dark:hover:bg-surface-muted/20 transition-all" [app]="app"
                                [isExpanded]="expandedAppId === app.id" [isSendingEmail]="isSendingEmail"
                                [isStatusPending]="pendingStatusIds.has(app.id)" (togglePanel)="onTogglePanel($event)"
                                (statusChange)="onUpdateStatus($event.id, $event.status)" (deleteApp)="onDelete($event)"
                                (sendEmail)="onSendEmail($event)" (copyBody)="onCopyBody($event)"
                                (notesSaved)="onSaveNotes($event.appId, $event.notes)">
                            </tr>
                            <tr *ngIf="expandedAppId === app.id"
                                class="bg-background-light/50 dark:bg-surface-muted/20">
                                <td colspan="6" class="px-4 pb-4">
                                    <app-email-panel [app]="app" [isSending]="isSendingEmail"
                                        [sendError]="sendErrorFor(app.id)" (sendEmail)="onSendEmail($event)"
                                        (copyBody)="onCopyBody($event)"
                                        (notesSaved)="onSaveNotes($event.appId, $event.notes)">
                                    </app-email-panel>
                                </td>
                            </tr>
                        </ng-container>
                    </tbody>
                </table>
            </div>

            <!-- Cards for mobile -->
            <div *ngIf="appPage?.content?.length" class="block md:hidden space-y-3">
                <ng-container *ngFor="let app of appPage!.content">
                    <div class="bg-surface-light dark:bg-surface-dark rounded-2xl border border-slate-200 dark:border-surface-muted shadow-sm overflow-hidden transition-all"
                        [ngClass]="{'ring-2 ring-primary/35 border-primary': expandedAppId === app.id}">

                        <!-- Tappable header -->
                        <button type="button"
                            class="w-full text-left p-4 flex items-start gap-3 active:bg-slate-50 dark:active:bg-surface-muted/30 transition"
                            [attr.aria-expanded]="expandedAppId === app.id" (click)="onTogglePanel(app.id)">

                            <div class="h-10 w-10 shrink-0 rounded-full flex items-center justify-center font-bold text-sm text-white"
                                [ngClass]="avatarColor(app.companyName)">
                                {{ app.companyName.charAt(0).toUpperCase() }}
                            </div>

                            <div class="min-w-0 flex-1">
                                <h3
                                    class="font-semibold text-slate-900 dark:text-slate-100 text-sm leading-snug truncate">
                                    {{ app.companyName }}
                                </h3>
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 truncate">
                                    {{ app.jobTitle || 'No title provided' }}
                                </p>
                                <div
                                    class="flex items-center gap-2 mt-1.5 text-[11px] text-slate-400 dark:text-slate-500">
                                    <span>{{ timeAgo(app.dateApplied) }}</span>
                                    <span class="h-0.5 w-0.5 rounded-full bg-slate-300 dark:bg-slate-600"></span>
                                    <span class="font-mono uppercase">{{ app.language || 'EN' }}</span>
                                </div>
                            </div>

                            <svg class="h-5 w-5 text-slate-300 dark:text-slate-600 shrink-0 mt-1 transition-transform"
                                [class.rotate-180]="expandedAppId === app.id" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>

                        <!-- Status + actions row -->
                        <div class="px-4 pb-4 flex items-center gap-2">
                            <div class="relative flex-1">
                                <select [ngModel]="app.status" [disabled]="pendingStatusIds.has(app.id)"
                                    (ngModelChange)="onUpdateStatus(app.id, $event)"
                                    [attr.aria-label]="'Change status for ' + app.companyName"
                                    class="w-full appearance-none rounded-full pl-3.5 pr-8 py-2 text-xs font-semibold border min-h-9 focus:outline-none focus:ring-2 focus:ring-primary/20 disabled:opacity-60 transition-all"
                                    [ngClass]="getStatusClasses(app.status)">
                                    <option value="COMPILED">Compiled</option>
                                    <option value="SENT">Sent</option>
                                    <option value="INTERVIEWING">Interviewing</option>
                                    <option value="REJECTED">Rejected</option>
                                </select>
                                <svg class="h-3.5 w-3.5 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none opacity-60"
                                    fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                                </svg>
                                <span *ngIf="pendingStatusIds.has(app.id)"
                                    class="absolute -right-1 -top-1 h-3 w-3 rounded-full border-2 border-primary border-t-transparent animate-spin"></span>
                            </div>

                            <button (click)="onTogglePanel(app.id)"
                                [attr.aria-label]="'View email for ' + app.companyName"
                                class="h-9 w-9 shrink-0 rounded-full flex items-center justify-center border border-slate-200 dark:border-surface-muted text-slate-500 dark:text-slate-400 active:bg-slate-100 dark:active:bg-surface-muted transition">
                                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                                    stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                </svg>
                            </button>

                            <button (click)="onDelete(app.id)" [attr.aria-label]="'Delete ' + app.companyName"
                                class="h-9 w-9 shrink-0 rounded-full flex items-center justify-center border border-rose-200/60 dark:border-rose-900/40 text-danger-textLight dark:text-danger-textDark active:bg-danger-bgLight dark:active:bg-danger-bgDark transition">
                                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                                    stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M6 7h12M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m2 0v12a2 2 0 01-2 2H8a2 2 0 01-2-2V7h12z" />
                                </svg>
                            </button>
                        </div>

                        <!-- Expanded email panel -->
                        <div *ngIf="expandedAppId === app.id"
                            class="border-t border-slate-100 dark:border-surface-muted/60 p-4 pt-3 bg-background-light/50 dark:bg-surface-muted/10">
                            <app-email-panel [app]="app" [isSending]="isSendingEmail" [sendError]="sendErrorFor(app.id)"
                                (sendEmail)="onSendEmail($event)" (copyBody)="onCopyBody($event)"
                                (notesSaved)="onSaveNotes($event.appId, $event.notes)">
                            </app-email-panel>
                        </div>
                    </div>
                </ng-container>
            </div>

            <!-- Empty states -->
            <div *ngIf="!appPage?.content?.length && !hasActiveFilters"
                class="text-center py-20 bg-surface-light dark:bg-surface-dark border border-dashed border-slate-300 dark:border-surface-muted rounded-2xl p-6">
                <div
                    class="h-12 w-12 rounded-full bg-primary/10 text-primary flex items-center justify-center mx-auto mb-3 text-xl font-bold">
                    📂</div>
                <p class="text-lg font-semibold text-slate-800 dark:text-slate-200">
                    No applications yet
                </p>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                    Start by compiling your first application
                </p>
                <button type="button" (click)="openCreateModal()"
                    class="mt-5 text-sm font-medium px-4 py-2 rounded-xl bg-primary/10 text-primary hover:bg-primary/20 transition">
                    + Compile New Application
                </button>
            </div>

            <div *ngIf="!appPage?.content?.length && hasActiveFilters"
                class="text-center py-20 bg-surface-light dark:bg-surface-dark border border-dashed border-slate-300 dark:border-surface-muted rounded-2xl p-6">
                <div
                    class="h-12 w-12 rounded-full bg-slate-100 dark:bg-surface-muted text-slate-400 flex items-center justify-center mx-auto mb-3 text-xl">
                    🔍</div>
                <p class="text-lg font-semibold text-slate-800 dark:text-slate-200">
                    No matches for these filters
                </p>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                    Try a different keyword or status filter setting
                </p>
                <button type="button" (click)="clearFilters()"
                    class="mt-5 text-sm font-medium px-4 py-2 rounded-xl bg-slate-100 dark:bg-surface-muted text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-surface-muted/85 transition">
                    Clear filters
                </button>
            </div>
        </div>

        <app-pagination [currentPage]="currentPage" [totalPages]="appTotalPages" [loading]="isLoading"
            (pageChange)="onPageChange($event)">
        </app-pagination>

    </ng-container>

    <app-delete-popup [isModalOpen]="showDeleteModal" [title]="'Confirm Deletion'" [message]="deleteMessage"
        (confirm)="onConfirmDelete()" (close)="onCancelDelete()" [isLoading]="isLoading">
    </app-delete-popup>

    <app-application-popup *ngIf="isModalOpen" [availableSkills]="availableSkills"
        [availableCategories]="availableCategories" [availableCvVariants]="availableCvVariants"
        [availableTemplates]="availableTemplates" [isLoading]="isLoading" (close)="closeModal()"
        (formSubmit)="onCreateSubmit($event)">
    </app-application-popup>

</div>
