<div class="border-l border-slate-200 dark:border-surface-muted flex flex-col px-3 sm:px-4 py-4 gap-3 relative">

  <!-- Discard Confirmation Overlay Popup -->
  <div *ngIf="showCancelConfirm"
    class="absolute inset-0 bg-surface-light/95 dark:bg-surface-dark/95 backdrop-blur-sm z-20 flex flex-col items-center justify-center p-4 text-center rounded-xl animate-fade-in">
    <p class="text-xs font-semibold text-slate-800 dark:text-slate-200 mb-1">Discard unsaved changes?</p>
    <p class="text-[11px] text-slate-500 dark:text-slate-400 mb-3">Your modifications will be lost.</p>
    <div class="flex items-center gap-2 w-full max-w-[200px]">
      <button type="button" (click)="dismissDiscard()"
        class="flex-1 py-1.5 text-xs font-medium rounded-lg border border-slate-200 dark:border-surface-muted text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-surface-muted transition">
        Keep editing
      </button>
      <button type="button" (click)="confirmDiscard()"
        class="flex-1 py-1.5 text-xs font-medium rounded-lg bg-rose-600 text-white hover:bg-rose-700 transition">
        Discard
      </button>
    </div>
  </div>

  <div class="flex items-center justify-between">
    <div class="flex items-center gap-2">
      <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wide">Notes</p>

      <!-- Saved Flash Badge -->
      <span *ngIf="savedFlash" role="status"
        class="inline-flex items-center gap-1 text-[10px] font-medium px-2 py-0.5 rounded-full bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-900 animate-fade-in">
        ✓ Saved successfully
      </span>
    </div>

    <button *ngIf="!isEditing" type="button"
      class="text-xs text-primary dark:text-primary-light hover:opacity-80 font-medium px-2.5 py-1.5 rounded-xl hover:bg-indigo-50 dark:hover:bg-indigo-950/40 transition-all active:scale-95"
      (click)="startEdit()" aria-label="Edit notes">
      Edit
    </button>
  </div>

  <ng-container *ngIf="!isEditing">
    <p *ngIf="app.notes; else noNotes"
      class="text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed whitespace-pre-wrap bg-background-light dark:bg-surface-muted/30 rounded-xl p-3.5 sm:p-3 flex-1 break-words border border-slate-100 dark:border-surface-muted/60">
      {{ app.notes }}
    </p>
    <ng-template #noNotes>
      <p
        class="text-xs sm:text-sm text-slate-400 dark:text-slate-500 italic bg-background-light dark:bg-surface-muted/30 rounded-xl p-3.5 sm:p-3 flex-1 border border-slate-100 dark:border-surface-muted/60">
        No notes yet.</p>
    </ng-template>
  </ng-container>

  <ng-container *ngIf="isEditing">
    <textarea [(ngModel)]="editValue" rows="5" [maxlength]="maxLength + 50" (keydown)="onKeydown($event)" autofocus
      [ngClass]="isOverLimit ? 'border-rose-400 dark:border-rose-500 focus:ring-rose-400' : 'border-primary/50 dark:border-primary/60 focus:ring-primary/20'"
      class="w-full rounded-xl border px-3.5 py-2.5 text-xs sm:text-sm text-slate-800 dark:text-slate-100 focus:ring-2 focus:outline-none resize-none leading-relaxed bg-background-light dark:bg-background-dark dark:placeholder-slate-500 transition-all shadow-sm"
      placeholder="Add your notes here…" aria-label="Notes text">
    </textarea>

    <div class="flex items-center justify-between text-[10px]">
      <span class="text-slate-400 dark:text-slate-500">⌘/Ctrl + Enter to save · Esc to cancel</span>
      <span
        [ngClass]="isOverLimit ? 'text-danger-textLight dark:text-danger-textDark font-semibold' : 'text-slate-400 dark:text-slate-500'">
        {{ charCount }} / {{ maxLength }}
      </span>
    </div>

    <div class="flex gap-2 justify-end sm:justify-end mt-1">
      <button type="button"
        class="flex-1 sm:flex-none text-xs text-slate-600 dark:text-slate-300 hover:text-slate-800 dark:hover:text-slate-100 font-medium px-4 py-2 rounded-xl border border-slate-200 dark:border-surface-muted hover:bg-background-light dark:hover:bg-surface-muted/50 transition-all active:scale-95 shadow-sm"
        (click)="cancelEdit()">
        Cancel
      </button>
      <button type="button" [disabled]="isOverLimit" (click)="save()"
        class="flex-1 sm:flex-none text-xs text-white font-medium px-4 py-2 rounded-xl bg-primary hover:bg-primary-hover transition-all active:scale-95 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
        Save
      </button>
    </div>
  </ng-container>
</div>
