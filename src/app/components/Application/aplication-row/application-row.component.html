<td class="px-3 sm:px-6 py-4 flex flex-col md:table-cell">
  <span class="font-semibold text-slate-900 dark:text-slate-100 text-sm md:text-base leading-tight">{{ app.companyName
    }}</span>
  <span class="text-slate-500 dark:text-slate-400 text-xs md:hidden mt-0.5">{{ app.jobTitle }}</span>
</td>
<td class="hidden md:table-cell px-6 py-4 text-slate-600 dark:text-slate-400">
  {{ app.jobTitle }}
</td>

<td class="px-3 sm:px-6 py-4 text-slate-500 dark:text-slate-400 text-[11px] sm:text-sm whitespace-nowrap">
  <span class="hidden md:inline">{{ app.dateApplied | date:'mediumDate' }}</span>
  <span class="md:hidden" [title]="app.dateApplied | date:'mediumDate'">
    {{ app.dateApplied | date:'shortDate' }}
  </span>
</td>

<td class="px-3 sm:px-6 py-4">
  <span
    class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] sm:text-xs font-medium bg-indigo-50 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-300 uppercase tracking-wider border border-indigo-200 dark:border-indigo-900">
    {{ app.language }}
  </span>
</td>

<td class="px-3 sm:px-6 py-4">
  <div class="relative inline-flex items-center w-full max-w-[150px]">
    <select [ngModel]="app.status" [disabled]="isStatusPending"
      (ngModelChange)="statusChange.emit({ id: app.id, status: $event })"
      [attr.aria-label]="'Change status for ' + app.companyName"
      style="-webkit-appearance: none; appearance: none; color-scheme: light dark;"
      class="w-full appearance-none rounded-xl shadow-sm focus:border-primary focus:ring-2 focus:ring-primary/20 text-[11px] sm:text-sm py-1.5 pl-3 pr-8 border border-slate-200 dark:border-surface-muted bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 disabled:opacity-60 disabled:cursor-wait transition-all cursor-pointer">

      <option value="COMPILED" class="bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300">Compiled</option>
      <option value="SENT" class="bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300">Sent</option>
      <option value="INTERVIEWING" class="bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300">Interviewing
      </option>
      <option value="OFFER" class="bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300">Offer</option>
      <option value="REJECTED" class="bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300">Rejected</option>

    </select>

    <div class="absolute right-2.5 flex items-center pointer-events-none text-slate-400 dark:text-slate-500">
      <span *ngIf="isStatusPending; else chevronIcon"
        class="inline-block animate-spin rounded-full h-3 w-3 border-2 border-primary border-t-transparent"></span>

      <ng-template #chevronIcon>
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </ng-template>
    </div>
  </div>
</td>

<td class="px-3 sm:px-6 py-4 flex flex-row md:table-cell items-center gap-2 space-x-0 md:space-x-2 whitespace-nowrap">
  <button (click)="togglePanel.emit(app.id)" [attr.aria-expanded]="isExpanded"
    [attr.aria-label]="(isExpanded ? 'Hide' : 'Show') + ' email for ' + app.companyName"
    [class]="isExpanded
        ? 'text-indigo-700 dark:text-indigo-300 bg-indigo-100 dark:bg-indigo-950/60 hover:bg-indigo-200 dark:hover:bg-indigo-900/60 font-medium text-[11px] sm:text-xs px-2.5 py-1.5 rounded-xl transition-all'
        : 'text-indigo-600 dark:text-indigo-400 hover:text-indigo-900 dark:hover:text-indigo-200 font-medium text-[11px] sm:text-xs bg-indigo-50 dark:bg-indigo-950/30 hover:bg-indigo-100 dark:hover:bg-indigo-950/60 px-2.5 py-1.5 rounded-xl transition-all'">
    {{ isExpanded ? '▲ Hide' : '▼ Email' }}
  </button>
  <button
    class="text-danger-textLight dark:text-danger-textDark hover:opacity-80 font-medium text-[11px] sm:text-xs bg-danger-bgLight dark:bg-danger-bgDark hover:opacity-90 px-2.5 py-1.5 rounded-xl transition-all border border-rose-200/50 dark:border-rose-900/40"
    [attr.aria-label]="'Delete application for ' + app.companyName" (click)="deleteApp.emit(app.id)">
    Delete
  </button>
</td>
