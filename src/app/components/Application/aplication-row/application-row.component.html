<td class="px-3 sm:px-6 py-4 flex flex-col md:table-cell">
  <div class="flex items-center gap-2 min-w-0">
    <span
      class="font-semibold text-slate-900 dark:text-slate-100 text-sm md:text-base leading-tight break-words min-w-0">{{
      app.companyName
      }}</span>

    <!-- Attachment Indicator Icon with lazy loading on hover/touch -->
    <span *ngIf="app.cvVariantId" (mouseenter)="fetchVariantName()" (touchstart)="fetchVariantName()"
      [title]="resolvedVariantName || (isLoadingVariant ? 'Loading...' : 'CV Variant #' + app.cvVariantId)"
      class="inline-flex items-center shrink-0 text-slate-400 dark:text-slate-500 hover:text-primary transition-colors cursor-help">
      <svg class="h-3.5 w-3.5 shrink-0 transform -rotate-45" fill="none" viewBox="0 0 24 24" stroke="currentColor"
        stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
      </svg>
    </span>
  </div>
  <span class="text-slate-500 dark:text-slate-400 text-xs md:hidden mt-0.5 break-words">{{
    app.jobTitle }}</span>
</td>
<td class="hidden md:table-cell px-6 py-4 text-slate-600 dark:text-slate-400 break-words">
  {{ app.jobTitle }}
</td>

<td class="px-3 sm:px-6 py-4 text-slate-500 dark:text-slate-400 text-[11px] sm:text-sm whitespace-nowrap">
  <span class="hidden md:inline">{{ app.dateApplied | date:'mediumDate' }}</span>
  <span class="md:hidden" [title]="app.dateApplied | date:'mediumDate'">
    {{ app.dateApplied | date:'shortDate' }}
  </span>
</td>

<td class="px-3 sm:px-6 py-4">
  <span
    class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] sm:text-xs font-medium uppercase tracking-wider border shadow-sm transition-colors duration-150"
    [ngClass]="(app.language.toLowerCase() === 'fr' || app.language.toLowerCase() === 'french')
      ? 'bg-blue-50 dark:bg-blue-950/50 text-blue-700 dark:text-blue-300 border-blue-200 dark:border-blue-800'
      : 'bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800'">
    {{ app.language }}
  </span>
</td>

<td class="px-3 sm:px-6 py-4">
  <div class="relative inline-flex items-center w-full max-w-[150px]">
    <select [ngModel]="app.status" [disabled]="isStatusPending || isStatusLocked"
      (ngModelChange)="statusChange.emit({ id: app.id, status: $event })"
      [attr.aria-label]="'Change status for ' + app.companyName" [title]="statusLockedTitle"
      style="-webkit-appearance: none; appearance: none; color-scheme: light dark;"
      class="w-full appearance-none rounded-full shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/20 text-[11px] sm:text-sm font-semibold py-1.5 pl-3 pr-8 border disabled:opacity-60 disabled:cursor-not-allowed transition-all cursor-pointer"
      [ngClass]="getStatusClasses(app.status)">

      <!-- shown only for rows that are actually COMPILED (i.e. the 'compiled' tab) — 'all' never has a COMPILED row, so this stays hidden there -->
      <option value="COMPILED" *ngIf="app.status === 'COMPILED'" disabled
        class="bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300">Compiled</option>
      <!-- disabled: SENT is set by the backend when the email actually sends, not chosen manually. Kept in the list (not removed) so a SENT row still has a matching option to display. -->
      <option value="SENT" disabled class="bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300">Sent</option>
      <option value="VIEWED" class="bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300">Viewed</option>
      <option value="RESPONDED" class="bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300">Responded</option>
      <option value="INTERVIEW_SCHEDULED" class="bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300">
        Interview Scheduled</option>
      <option value="INTERVIEWING" class="bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300">Interviewing
      </option>
      <option value="OFFER" class="bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300">Offer</option>
      <option value="REJECTED" class="bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300">Rejected</option>
      <option value="GHOSTED" class="bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300">Ghosted</option>
      <option value="WITHDRAWN" class="bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300">Withdrawn</option>
    </select>

    <div class="absolute right-2.5 flex items-center pointer-events-none text-slate-400 dark:text-slate-500">
      <span *ngIf="isStatusPending; else chevronIcon"
        class="inline-block animate-spin rounded-full h-3 w-3 border-2 border-primary border-t-transparent"></span>

      <ng-template #chevronIcon>
        <svg *ngIf="!isStatusLocked" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
        <svg *ngIf="isStatusLocked" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
          stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </ng-template>
    </div>
  </div>
</td>

<td
  class="px-3 sm:px-6 py-4 flex flex-row md:table-cell items-center gap-2 space-x-0 md:space-x-2 whitespace-nowrap overflow-visible">
  <button (click)="togglePanel.emit(app.id)" [attr.aria-expanded]="isExpanded"
    [attr.aria-label]="(isExpanded ? 'Hide' : 'Show') + ' email for ' + app.companyName"
    [class]="isExpanded
        ? 'text-indigo-700 dark:text-white bg-indigo-100 dark:bg-indigo-950/60 hover:bg-indigo-200 dark:hover:bg-indigo-900/60 font-medium text-[11px] sm:text-xs px-2.5 py-1.5 rounded-xl transition-all'
        : 'text-indigo-600 dark:text-white hover:text-indigo-900 dark:hover:text-indigo-200 font-medium text-[11px] sm:text-xs bg-indigo-50 dark:bg-indigo-950/30 hover:bg-indigo-100 dark:hover:bg-indigo-950/60 px-2.5 py-1.5 rounded-xl transition-all'">
    {{ isExpanded ? '▲ Hide' : '▼ Email' }}
  </button>

  <!-- View Details: jumps to the Application Timeline History section for this app.
       Hidden for COMPILED rows — they haven't been sent yet, so there's no
       timeline history to view. -->
  <button *ngIf="!isStatusLocked"
    class="text-slate-600 dark:text-white hover:text-slate-900 dark:hover:text-slate-200 font-medium text-[11px] sm:text-xs bg-slate-100 dark:bg-slate-800/50 hover:bg-slate-200 dark:hover:bg-slate-800 px-2.5 py-1.5 rounded-xl transition-all"
    [attr.aria-label]="'View details for ' + app.companyName" (click)="viewDetails()">
    Details
  </button>

  <!-- Greyed out while an email is sending (incl. the undo window) or a
       status update is in flight, so a delete can't race either request. -->
  <button [disabled]="isDeleteDisabled" [title]="deleteDisabledTitle"
    [ngClass]="isDeleteDisabled
        ? 'text-slate-400 dark:text-slate-500 bg-slate-100 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700 cursor-not-allowed opacity-60'
        : 'text-danger-textLight dark:text-white hover:opacity-80 bg-danger-bgLight dark:bg-danger-bgDark hover:opacity-90 border border-rose-200/50 dark:border-rose-900/40'"
    class="font-medium text-[11px] sm:text-xs px-2.5 py-1.5 rounded-xl transition-all"
    [attr.aria-label]="'Delete application for ' + app.companyName" (click)="deleteApp.emit(app.id)">
    Delete
  </button>
</td>
