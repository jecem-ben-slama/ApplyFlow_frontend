<div class="fixed bottom-4 right-4 z-[100] flex flex-col gap-2 w-[calc(100%-2rem)] max-w-sm pointer-events-none">
    <div *ngFor="let toast of (toasts$ | async)"
        class="pointer-events-auto flex items-start gap-3 rounded-2xl border px-4 py-3 text-sm shadow-lg backdrop-blur-md animate-fade-in"
        [ngClass]="{
            'border-success bg-success-bg/95 text-success-text dark:border-emerald-500/20 dark:bg-emerald-500/10 dark:text-emerald-100': toast.type === 'success',
            'border-danger bg-danger-bg/95 text-danger-text dark:border-rose-500/20 dark:bg-rose-500/10 dark:text-rose-100': toast.type === 'error',
            'border-slate-200 bg-white/95 text-slate-700 dark:border-slate-800 dark:bg-slate-900/95 dark:text-slate-200': toast.type === 'info'
        }">
        <mat-icon class="!text-base !w-5 !h-5 mt-0.5 shrink-0">{{ iconFor(toast.type) }}</mat-icon>
        <span class="flex-1">{{ toast.message }}</span>
        <button type="button" (click)="dismiss(toast.id)" aria-label="Dismiss notification"
            class="shrink-0 rounded-lg p-1 -m-1 hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
            <mat-icon class="!text-base !w-4 !h-4 block">close</mat-icon>
        </button>
    </div>
</div>
