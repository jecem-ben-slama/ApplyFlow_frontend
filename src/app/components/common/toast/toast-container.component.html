<!-- Toast container -->
<div class="fixed bottom-5 right-5 z-[100] flex w-[calc(100%-2.5rem)] max-w-sm flex-col gap-3 pointer-events-none">

    <div *ngFor="let toast of (toasts$ | async); trackBy: trackById" [@toastAnimation] class="group pointer-events-auto relative flex items-start gap-3.5 overflow-hidden
               rounded-2xl border border-slate-200/80 bg-white/90
               px-4 py-3.5
               shadow-[0_12px_35px_-12px_rgba(15,23,42,0.22)]
               backdrop-blur-xl
               transition-all duration-200
               hover:-translate-y-0.5 hover:shadow-[0_16px_40px_-12px_rgba(15,23,42,0.28)]
               dark:border-white/[0.08]
               dark:bg-slate-900/90
               dark:shadow-[0_16px_40px_-14px_rgba(0,0,0,0.65)]">

        <!-- subtle type glow -->
        <div class="pointer-events-none absolute -left-8 -top-8 h-24 w-24 rounded-full blur-3xl opacity-20" [ngClass]="{
                'bg-emerald-400': toast.type === 'success',
                'bg-rose-400': toast.type === 'error',
                'bg-sky-400': toast.type === 'info'
            }">
        </div>

        <!-- accent line -->
        <span class="absolute left-0 top-3 bottom-3 w-1 rounded-r-full" [ngClass]="{
                'bg-emerald-500': toast.type === 'success',
                'bg-rose-500': toast.type === 'error',
                'bg-sky-500': toast.type === 'info'
            }">
        </span>

        <!-- Icon -->
        <span class="relative mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center
                   rounded-xl ring-1" [ngClass]="{
                'bg-emerald-50 text-emerald-600 ring-emerald-500/10 dark:bg-emerald-500/10 dark:text-emerald-400 dark:ring-emerald-400/10':
                    toast.type === 'success',

                'bg-rose-50 text-rose-600 ring-rose-500/10 dark:bg-rose-500/10 dark:text-rose-400 dark:ring-rose-400/10':
                    toast.type === 'error',

                'bg-sky-50 text-sky-600 ring-sky-500/10 dark:bg-sky-500/10 dark:text-sky-400 dark:ring-sky-400/10':
                    toast.type === 'info'
            }">

            <mat-icon class="!flex !h-[18px] !w-[18px] !items-center !justify-center !text-[18px]">
                {{ iconFor(toast.type) }}
            </mat-icon>
        </span>

        <!-- Content -->
        <div class="min-w-0 flex-1 pt-0.5">

            <!-- optional type label -->
            <div class="mb-0.5 text-[10px] font-bold uppercase tracking-[0.12em]" [ngClass]="{
                    'text-emerald-600 dark:text-emerald-400': toast.type === 'success',
                    'text-rose-600 dark:text-rose-400': toast.type === 'error',
                    'text-sky-600 dark:text-sky-400': toast.type === 'info'
                }">
                {{
                toast.type === 'success'
                ? 'Success'
                : toast.type === 'error'
                ? 'Error'
                : 'Information'
                }}
            </div>

            <p class="m-0 pr-1 text-[13px] font-medium leading-[1.4rem]
                       text-slate-700 dark:text-slate-200">
                {{ toast.message }}
            </p>
        </div>

        <!-- Action -->
        <button *ngIf="toast.action" type="button" (click)="onAction(toast)" class="mt-0.5 shrink-0 self-start rounded-lg px-2.5 py-1.5
                   text-[11px] font-bold uppercase tracking-wide
                   transition-all duration-150
                   focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2
                   dark:focus-visible:ring-offset-slate-900" [ngClass]="{
                'text-emerald-600 hover:bg-emerald-50 hover:text-emerald-700 focus-visible:ring-emerald-400 dark:text-emerald-400 dark:hover:bg-emerald-500/10':
                    toast.type === 'success',

                'text-rose-600 hover:bg-rose-50 hover:text-rose-700 focus-visible:ring-rose-400 dark:text-rose-400 dark:hover:bg-rose-500/10':
                    toast.type === 'error',

                'text-sky-600 hover:bg-sky-50 hover:text-sky-700 focus-visible:ring-sky-400 dark:text-sky-400 dark:hover:bg-sky-500/10':
                    toast.type === 'info'
            }">

            {{ toast.action.label }}

            <span *ngIf="toast.duration" class="ml-0.5 opacity-60">
                {{ secondsLeft(toast) }}s
            </span>
        </button>

        <!-- Close -->
        <button type="button" (click)="dismiss(toast)" aria-label="Dismiss notification" class="mt-0.5 shrink-0 rounded-lg p-1.5
                   text-slate-400
                   transition-all duration-150
                   hover:bg-slate-100 hover:text-slate-600
                   focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400
                   dark:text-slate-500 dark:hover:bg-white/[0.07] dark:hover:text-slate-300">

            <mat-icon class="!block !h-4 !w-4 !text-[16px]">
                close
            </mat-icon>
        </button>

        <!-- Progress -->
        <span *ngIf="toast.duration" class="absolute bottom-0 left-0 h-[2px] origin-left rounded-r-full" [ngClass]="{
                'bg-emerald-500/60': toast.type === 'success',
                'bg-rose-500/60': toast.type === 'error',
                'bg-sky-500/60': toast.type === 'info'
            }" [style.animation]="'toast-shrink ' + toast.duration + 'ms linear forwards'">
        </span>
    </div>
</div>
