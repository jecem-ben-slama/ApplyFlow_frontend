<div
    class="bg-surface-light dark:bg-surface border border-slate-200 dark:border-surface-muted rounded-3xl shadow-sm p-5 md:p-6 flex flex-col gap-4">

    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div class="flex flex-col sm:flex-row sm:items-center gap-3 w-full md:w-auto">
            <label
                class="text-[10px] uppercase tracking-[0.3em] font-semibold text-slate-500 dark:text-slate-400 whitespace-nowrap">
                Language
            </label>
            <select [value]="selectedLanguage" (change)="languageChange.emit($any($event.target).value)"
                class="w-full md:w-44 bg-surface-light dark:bg-background border border-slate-200 dark:border-surface-muted rounded-xl px-3.5 py-2.5 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all shadow-sm">
                <option value="">All Languages</option>
                <option value="en">English (EN)</option>
                <option value="fr">French (FR)</option>
            </select>
        </div>

        <button (click)="addClick.emit()"
            class="inline-flex items-center justify-center gap-2 rounded-xl bg-primary hover:opacity-90 text-white text-sm  px-5 py-2.5 transition-all shadow-sm shadow-primary/10 whitespace-nowrap">
            <span class="text-base leading-none">+</span>
            Add Attachment
        </button>
    </div>

    <div class="relative">
        <mat-icon
            class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-base pointer-events-none">search</mat-icon>
        <input type="text" [value]="searchQuery" (input)="searchChange.emit($any($event.target).value)"
            placeholder="Search by name, language, or file URL…"
            class="w-full bg-surface-light dark:bg-background border border-slate-200 dark:border-surface-muted rounded-xl pl-10 pr-10 py-2.5 text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all shadow-sm" />
        <button *ngIf="searchQuery" (click)="clearSearch.emit()"
            class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
            <mat-icon class="text-base">close</mat-icon>
        </button>
    </div>

  

</div>
