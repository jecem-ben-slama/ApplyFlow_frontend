<div class="space-y-3">
    <div *ngIf="error"
        class="flex items-start gap-3 rounded-2xl border border-rose-200 bg-danger-bgLight text-danger-textLight px-4 py-3 text-sm dark:border-rose-500/20 dark:bg-danger-bgDark dark:text-danger-textDark shadow-sm">
        <mat-icon class="!text-base !w-5 !h-5 mt-0.5 shrink-0">error_outline</mat-icon>
        <span class="flex-1 font-medium">{{ error }}</span>
        <button type="button" (click)="dismissError.emit()" aria-label="Dismiss error"
            class="shrink-0 rounded-xl p-1.5 -m-1 opacity-70 hover:opacity-100 hover:bg-rose-100/50 dark:hover:bg-rose-500/20 transition-all">
            <mat-icon class="!text-base !w-4 !h-4 block">close</mat-icon>
        </button>
    </div>
    <div *ngIf="success"
        class="flex items-start gap-3 rounded-2xl border border-emerald-200 dark:border-emerald-500/20 bg-success-bgLight text-success-textLight px-4 py-3 text-sm dark:bg-success-bgDark dark:text-success-textDark shadow-sm">
        <mat-icon class="!text-base !w-5 !h-5 mt-0.5 shrink-0">check_circle_outline</mat-icon>
        <span class="flex-1 font-medium">{{ success }}</span>
        <button type="button" (click)="dismissSuccess.emit()" aria-label="Dismiss message"
            class="shrink-0 rounded-xl p-1.5 -m-1 opacity-70 hover:opacity-100 hover:bg-emerald-100/50 dark:hover:bg-emerald-500/20 transition-all">
            <mat-icon class="!text-base !w-4 !h-4 block">close</mat-icon>
        </button>
    </div>
</div>
