<div class="p-6 md:p-8 space-y-6 text-slate-900 dark:text-slate-100 max-w-full mx-auto w-full">

    <div class="border-b border-slate-200 dark:border-slate-800 pb-4">
        <h1 class="text-xl md:text-2xl font-bold tracking-tight">Attachment Management</h1>
        <p class="text-slate-500 dark:text-slate-400 text-xs mt-1">
            Manage your different CVs, cover letters, and application profiles in one place.
        </p>
    </div>

    <div class="space-y-6">

        <!-- Filters bar + feedback: always mounted, never replaced by skeleton -->
        <app-cv-filters-bar [selectedLanguage]="selectedLanguage" [searchQuery]="searchQuery"
            [resultsLabel]="resultsLabel" [hasActiveFilters]="hasActiveFilters"
            (languageChange)="onLanguageFilterChange($event)" (searchChange)="onSearchChange($event)"
            (clearSearch)="clearSearch()" (addClick)="openCreateModal()" (clearAllFilters)="clearAllFilters()"
            class="block animate-fade-in">
        </app-cv-filters-bar>


        <!-- Skeleton replaces this section for any load: first mount, or a later
             refetch from search / filter / sort / page change. -->
        <ng-container *ngIf="isListLoading || isRefetching">
            <div
                class="rounded-3xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4 sm:p-5 shadow-sm">
                <div class="space-y-4">
                    <app-skeleton type="table" [itemsCount]="5" class="block"></app-skeleton>
                </div>
            </div>
        </ng-container>

        <ng-container *ngIf="!isListLoading && !isRefetching">

            <div class="relative">
                <app-cv-table *ngIf="cvPage?.content?.length" [rows]="cvPage!.content" [loading]="isDeleting"
                    [sortBy]="sortBy" [direction]="direction" (edit)="openEditModal($event)" (delete)="onDelete($event)"
                    (sortChange)="onSortChange($event)">
                </app-cv-table>

            <div *ngIf="!cvPage?.content?.length"
                class="rounded-3xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 p-8 text-center text-slate-500 dark:text-slate-400 animate-fade-in shadow-sm">
                <ng-container *ngIf="hasActiveFilters; else noData">
                    No CV matched your current filters.
                    <button (click)="clearAllFilters()"
                        class="ml-2 text-indigo-600 dark:text-indigo-400 hover:underline text-sm font-semibold">
                        Clear filters
                    </button>
                </ng-container>
                <ng-template #noData>
                    <p>No CV created yet. Add your first attachment to get started.</p>
                <button (click)="openCreateModal()"
                    class="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-xs font-semibold text-white bg-primary hover:bg-primary/90 shadow-sm transition">
                   + Add your first CV
                </button>
                </ng-template>
              
            </div>
            </div>

            <app-pagination *ngIf="(cvPage?.totalPages ?? 0) > 1" [currentPage]="currentPage"
                [totalPages]="cvPage?.totalPages ?? 0" [loading]="false" (pageChange)="onPageChange($event)">
            </app-pagination>

        </ng-container>

    </div>

    <app-delete-popup [isModalOpen]="showDeleteModal" [title]="'Confirm Deletion'" [message]="deleteMessage"
        [isLoading]="isDeleting" (confirm)="onConfirmDelete()" (close)="onCancelDelete()">
    </app-delete-popup>

    <app-cv-popup [isModalOpen]="isModalOpen" [isEditing]="isEditing" [formModel]="formModel" [isLoading]="isSubmitting"
        (close)="closeModal()" (save)="onSubmit()">
    </app-cv-popup>

    <app-toast-container></app-toast-container>

</div>
