<div
    class="overflow-hidden rounded-3xl border border-slate-200 dark:border-surface-muted bg-surface-light dark:bg-surface shadow-sm">

    <div class="hidden md:block overflow-x-auto">
        <table class="w-full text-left border-collapse min-w-[720px]">
            <thead>
                <tr
                    class="bg-background-light dark:bg-surface-muted/30 text-slate-500 dark:text-slate-400 text-[10px] uppercase tracking-[0.18em] font-semibold border-b border-slate-200 dark:border-surface-muted">
                    <th class="py-3.5 px-5">
                        <button type="button" (click)="onSortClick('name')"
                            class="inline-flex items-center gap-1.5 hover:text-slate-900 dark:hover:text-slate-100 transition-colors">
                            Name
                            <mat-icon *ngIf="sortBy === 'name'" class="!text-sm !w-3.5 !h-3.5">
                                {{ direction === 'asc' ? 'arrow_upward' : 'arrow_downward' }}
                            </mat-icon>
                        </button>
                    </th>
                    <th class="py-3.5 px-5 w-32">
                        <button type="button" (click)="onSortClick('language')"
                            class="inline-flex items-center gap-1.5 hover:text-slate-900 dark:hover:text-slate-100 transition-colors">
                            Language
                            <mat-icon *ngIf="sortBy === 'language'" class="!text-sm !w-3.5 !h-3.5">
                                {{ direction === 'asc' ? 'arrow_upward' : 'arrow_downward' }}
                            </mat-icon>
                        </button>
                    </th>
                    <th class="py-3.5 px-5">File URL</th>
                    <th class="py-3.5 px-5 text-right w-40">Actions</th>
                </tr>
            </thead>
            <tbody class="text-sm divide-y divide-slate-200 dark:divide-surface-muted/60">
                <tr *ngFor="let cv of rows"
                    class="hover:bg-background-light/50 dark:hover:bg-surface-muted/20 transition-colors">
                    <td class="py-4 px-5 text-slate-900 dark:text-slate-100 font-semibold">{{ cv.name }}</td>
                    <td class="py-4 px-5">
                        <span
                            class="inline-flex items-center rounded-full bg-indigo-50 dark:bg-indigo-950/50 px-2.5 py-1 text-[10px] font-semibold uppercase tracking-wider text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-900">
                            {{ cv.language | uppercase }}
                        </span>
                    </td>
                    <td class="py-4 px-5 text-slate-600 dark:text-slate-400 max-w-xs">
                        <a [href]="cv.fileUrl" target="_blank" [title]="cv.fileUrl"
                            class="text-primary hover:underline block truncate font-mono text-xs">
                            {{ cv.fileUrl }}
                        </a>
                    </td>
                    <td class="py-4 px-5 text-right whitespace-nowrap">
                        <button (click)="edit.emit(cv)" [disabled]="loading"
                            class="inline-flex items-center justify-center rounded-xl border border-slate-200 dark:border-surface-muted bg-surface-light dark:bg-background text-slate-700 dark:text-slate-200 px-3.5 py-2 text-xs  hover:bg-slate-100 dark:hover:bg-surface-muted transition-all mr-2 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
                            Edit
                        </button>
                        <button (click)="delete.emit(cv)" [disabled]="loading"
                            class="inline-flex items-center justify-center rounded-xl border border-rose-200 dark:border-rose-900/40 bg-danger-bgLight dark:bg-danger-bgDark text-danger-textLight dark:text-white px-3.5 py-2 text-xs  hover:opacity-90 transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
                            Delete
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="block md:hidden divide-y divide-slate-200 dark:divide-surface-muted">
        <div *ngFor="let cv of rows"
            class="p-4 space-y-3 hover:bg-background-light/50 dark:hover:bg-surface-muted/20 transition-colors">

            <div class="flex justify-between items-start gap-3">
                <div class="min-w-0 flex-1">
                    <h4 class="font-bold text-slate-900 dark:text-slate-100 text-sm break-words">{{ cv.name }}</h4>
                </div>
                <span
                    class="inline-flex items-center rounded-full bg-indigo-50 dark:bg-indigo-950/50 px-2.5 py-0.5 text-[9px] font-semibold uppercase tracking-wider text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-900 shrink-0">
                    {{ cv.language | uppercase }}
                </span>
            </div>

            <div
                class="bg-background-light dark:bg-surface-muted/30 p-3 rounded-2xl border border-slate-200 dark:border-surface-muted/60 break-all overflow-hidden">
                <span
                    class="block text-[10px] font-semibold uppercase tracking-[0.12em] text-slate-400 dark:text-slate-500 mb-1">File
                    Destination</span>
                <a [href]="cv.fileUrl" target="_blank"
                    class="text-xs text-primary hover:underline break-all line-clamp-2 font-mono">
                    {{ cv.fileUrl }}
                </a>
            </div>

            <div class="flex gap-2 justify-end pt-1">
                <button (click)="edit.emit(cv)" [disabled]="loading"
                    class="flex-1 sm:flex-none inline-flex items-center justify-center rounded-xl border border-slate-200 dark:border-surface-muted bg-surface-light dark:bg-background text-slate-700 dark:text-slate-200 px-4 py-2.5 text-xs font-semibold hover:bg-slate-100 dark:hover:bg-surface-muted transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
                    Edit Variant
                </button>
                <button (click)="delete.emit(cv)" [disabled]="loading"
                    class="flex-1 sm:flex-none inline-flex items-center justify-center rounded-xl border border-rose-200 dark:border-rose-900/40 bg-danger-bgLight dark:bg-danger-bgDark text-danger-textLight dark:text-danger-textDark px-4 py-2.5 text-xs font-semibold hover:opacity-90 transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
                    Delete
                </button>
            </div>
        </div>
    </div>

</div>
