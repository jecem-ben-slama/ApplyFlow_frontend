<div
    class="bg-surface-light dark:bg-surface border border-slate-200 dark:border-surface-muted rounded-3xl shadow-sm overflow-hidden">

    <!-- FILTER BAR — always visible, no collapse, this is the primary interaction -->
    <div class="p-5 md:px-6 md:py-5 space-y-3">
        <div class="flex items-center justify-between gap-4">
            <span class="text-[10px] font-semibold uppercase tracking-[0.18em] text-slate-400 dark:text-slate-500">
                Filter by Category
            </span>
            <button type="button" (click)="toggleManage()"
                class="inline-flex items-center gap-1.5 text-[11px] font-semibold text-slate-500 hover:text-primary dark:text-slate-400 dark:hover:text-primary transition-colors">
                Manage
                <mat-icon
                    class="!w-3.5 !h-3.5 !flex !items-center !justify-center text-sm leading-none transition-transform duration-200"
                    [class.rotate-180]="isManageOpen">expand_more</mat-icon>
            </button>
        </div>

        <div class="flex flex-wrap gap-2">
            <button type="button" (click)="onSelectCategory(null)"
                [class]="'inline-flex items-center rounded-full px-3.5 py-1.5 text-xs font-semibold transition-all border ' +
                (selectedFilterCategoryId === null
                    ? 'bg-primary border-primary text-white shadow-sm shadow-primary/20'
                    : 'bg-background-light border-slate-200 text-slate-600 hover:border-primary/50 hover:text-primary dark:bg-surface-muted/30 dark:border-surface-muted dark:text-slate-300')">
                All
            </button>

            <button *ngFor="let cat of categories" type="button" (click)="onSelectCategory(cat.id)"
                [class]="'inline-flex items-center rounded-full px-3.5 py-1.5 text-xs font-semibold transition-all border ' +
                (selectedFilterCategoryId === cat.id
                    ? 'bg-primary border-primary text-white shadow-sm shadow-primary/20'
                    : 'bg-background-light border-slate-200 text-slate-600 hover:border-primary/50 hover:text-primary dark:bg-surface-muted/30 dark:border-surface-muted dark:text-slate-300')">
                {{ cat.name }}
            </button>

            <button *ngIf="categories.length === 0" type="button" (click)="addCategory.emit()"
                class="inline-flex items-center gap-1.5 rounded-full px-3.5 py-1.5 text-xs font-semibold border border-dashed border-slate-300 dark:border-surface-muted text-slate-400 hover:border-primary hover:text-primary transition-all">
                <mat-icon class="!w-3.5 !h-3.5 text-sm">add</mat-icon>
                Add your first category
            </button>
        </div>
    </div>

    <!-- MANAGE PANEL — separate, deliberate, no accidental filter clicks -->
    <div *ngIf="isManageOpen" @sectionSlide
        class="border-t border-slate-200 dark:border-surface-muted bg-background-light/50 dark:bg-surface-muted/20">
        <div class="p-5 md:px-6 space-y-3">
            <div class="flex items-center justify-between">
                <h3 class="text-xs font-bold text-slate-700 dark:text-slate-200">Manage Categories</h3>
                <button type="button" (click)="addCategory.emit()"
                    class="inline-flex items-center gap-1.5 rounded-xl border border-primary bg-primary px-3.5 py-1.5 text-[11px] font-semibold text-white hover:opacity-90 transition-all shadow-sm">
                    <mat-icon class="!w-3.5 !h-3.5 text-sm">add</mat-icon>
                    New Category
                </button>
            </div>

            <div *ngIf="categories.length === 0" class="text-xs text-slate-400 py-3 text-center">
                No categories yet.
            </div>

            <ul *ngIf="categories.length > 0"
                class="divide-y divide-slate-200 dark:divide-surface-muted rounded-2xl border border-slate-200 dark:border-surface-muted overflow-hidden bg-surface-light dark:bg-surface shadow-sm">
                <li *ngFor="let cat of categories"
                    class="flex items-center justify-between px-4 py-3 hover:bg-background-light/50 dark:hover:bg-surface-muted/30 transition-colors">
                    <span class="text-xs font-semibold text-slate-700 dark:text-slate-300 truncate">{{ cat.name
                        }}</span>
                    <div class="flex items-center gap-1">
                        <button type="button" (click)="onEdit(cat, $event)" title="Edit category"
                            class="inline-flex items-center justify-center rounded-xl p-2 text-slate-400 hover:text-primary hover:bg-primary/10 dark:hover:bg-primary/20 transition-colors">
                            <mat-icon class="!w-4 !h-4 text-sm">edit</mat-icon>
                        </button>
                        <button type="button" (click)="onDelete(cat, $event)" title="Delete category"
                            class="inline-flex items-center justify-center rounded-xl p-2 text-slate-400 hover:text-danger-textLight dark:hover:text-danger-textDark hover:bg-danger-bgLight dark:hover:bg-danger-bgDark transition-colors">
                            <mat-icon class="!w-4 !h-4 text-sm">delete</mat-icon>
                        </button>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</div>
