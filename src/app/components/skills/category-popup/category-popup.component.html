<div *ngIf="isModalOpen" (click)="onCancel()"
    class="fixed inset-0 z-[10000] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md">
    <div (click)="$event.stopPropagation()" role="dialog" aria-modal="true"
        [attr.aria-label]="isEditing ? 'Edit Category' : 'New Category'"
        class="w-full max-w-xl rounded-3xl border border-slate-200 dark:border-surface-muted bg-surface-light dark:bg-surface p-6 shadow-2xl overflow-hidden relative">

        <!-- accent bar -->
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-primary via-indigo-400 to-primary">
        </div>

        <!-- Header -->
        <div class="flex items-start justify-between gap-4 mb-6 mt-1">
            <div>
                <h2 class="text-xl font-bold tracking-tight text-slate-900 dark:text-slate-100">
                    {{ isEditing ? 'Edit Category' : 'New Category' }}
                </h2>
                <p class="text-slate-500 dark:text-slate-400 text-xs mt-1">
                    Group related skills together for smarter filtering and display.
                </p>
            </div>
            <button type="button" (click)="onCancel()"
                class="rounded-xl p-2 text-slate-400 hover:bg-background-light dark:hover:bg-surface-muted hover:text-slate-600 dark:hover:text-slate-200 transition-all flex-shrink-0">
                <mat-icon>close</mat-icon>
            </button>
        </div>

        <!-- Form -->
        <form #categoryForm="ngForm" (ngSubmit)="onSubmit(categoryForm)" class="space-y-5">

            <div id="tour-category-name-field" class="space-y-2">
                <label
                    class="block text-[10px] font-semibold uppercase tracking-[0.18em] text-slate-400 dark:text-slate-500">
                    Category Name
                </label>
                <input type="text" name="categoryName" [(ngModel)]="internalName" required minlength="2"
                    placeholder="e.g., Frontend, Backend, DevOps" autofocus
                    class="w-full rounded-2xl border border-slate-200 dark:border-surface-muted bg-background-light dark:bg-background px-4 py-3 text-sm text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-all shadow-sm" />

                <ng-container *ngIf="categoryForm.controls['categoryName'] as ctrl">
                    <p *ngIf="(categoryForm.submitted || ctrl.touched) && ctrl.errors"
                        class="text-danger-textLight dark:text-danger-textDark text-xs mt-1">
                        <span *ngIf="ctrl.errors['required']">Category name is required.</span>
                        <span *ngIf="ctrl.errors['minlength']">Must be at least 2 characters.</span>
                    </p>
                </ng-container>
            </div>

            <!-- Error message -->
            <div *ngIf="internalError"
                class="rounded-2xl border border-rose-200 dark:border-rose-900/40 bg-danger-bgLight dark:bg-danger-bgDark text-danger-textLight dark:text-danger-textDark px-4 py-3 text-sm flex items-start gap-2.5 shadow-sm">
                <mat-icon class="text-base flex-shrink-0 mt-0.5">error_outline</mat-icon>
                <span>{{ internalError }}</span>
            </div>

            <!-- Actions -->
            <div
                class="flex flex-col sm:flex-row items-center justify-end gap-3 pt-4 border-t border-slate-200 dark:border-surface-muted">
                <button type="button" (click)="onCancel()" [disabled]="isLoading"
                    class="w-full sm:w-auto rounded-xl border border-slate-200 dark:border-surface-muted bg-surface-light dark:bg-background px-5 py-2.5 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-surface-muted disabled:opacity-50 transition-all shadow-sm">
                    Cancel
                </button>
                <button id="tour-category-save-btn" type="submit" [disabled]="isLoading"
                    class="w-full sm:w-auto rounded-xl bg-primary hover:opacity-90 disabled:opacity-60 disabled:cursor-not-allowed px-5 py-2.5 text-xs font-semibold text-white transition-all shadow-md shadow-primary/25 inline-flex items-center justify-center gap-2">
                    <span *ngIf="isLoading"
                        class="inline-block w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                    <span>{{ isLoading ? 'Saving…' : (isEditing ? 'Save Changes' : 'Create Category') }}</span>
                </button>
            </div>
        </form>
    </div>
</div>
