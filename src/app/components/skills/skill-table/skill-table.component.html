<div
    class="bg-surface-light dark:bg-surface border border-slate-200 dark:border-surface-muted rounded-3xl p-4 md:p-6 shadow-sm space-y-6">

    <app-skeleton *ngIf="loading" type="table" [itemsCount]="5"></app-skeleton>

    <div *ngIf="!loading"
        class="hidden md:block overflow-x-auto border border-slate-200 dark:border-surface-muted rounded-2xl bg-surface-light dark:bg-background shadow-sm">
        <table class="w-full text-left border-collapse min-w-[860px]">
            <thead>
                <tr
                    class="border-b border-slate-200 dark:border-surface-muted text-[11px] font-semibold uppercase text-slate-500 dark:text-slate-400 tracking-[0.18em] bg-background-light/80 dark:bg-surface-muted/20">
                    <th class="py-4 px-5">Name</th>
                    <th class="py-4 px-5">Category</th>
                    <th class="py-4 px-5 w-1/3">English Sentence</th>
                    <th class="py-4 px-5 w-1/3">French Sentence</th>
                    <th class="py-4 px-5 text-right w-28">Actions</th>
                </tr>
            </thead>
            <tbody class="text-xs divide-y divide-slate-200 dark:divide-surface-muted">
                <tr *ngFor="let skill of skills"
                    class="hover:bg-background-light/50 dark:hover:bg-surface-muted/30 transition-colors">
                    <td class="py-4 px-5 font-semibold text-slate-900 dark:text-slate-100 whitespace-nowrap">
                        {{ skill.name }}
                    </td>
                    <td class="py-4 px-5 whitespace-nowrap">
                        <span *ngIf="skill.categoryName"
                            class="inline-block text-[10px] font-semibold px-2.5 py-1 rounded-full bg-primary/10 border border-primary/20 dark:bg-primary/20 dark:text-primary dark:border-primary/30">
                            {{ skill.categoryName }}
                        </span>
                        <span *ngIf="!skill.categoryName" class="text-slate-400 select-none">—</span>
                    </td>
                    <td class="py-4 px-5 text-slate-600 dark:text-slate-400 max-w-0">
                        <span class="line-clamp-2 leading-relaxed" [title]="skill.sentenceEn">{{ skill.sentenceEn
                            }}</span>
                    </td>
                    <td class="py-4 px-5 text-slate-600 dark:text-slate-400 max-w-0">
                        <span class="line-clamp-2 leading-relaxed" [title]="skill.sentenceFr">{{ skill.sentenceFr
                            }}</span>
                    </td>
                    <td class="py-4 px-5 text-right whitespace-nowrap">
                        <div class="inline-flex items-center gap-1">
                            <button (click)="editSkill.emit(skill)" title="Edit"
                                [attr.aria-label]="'Edit ' + skill.name"
                                class="text-slate-400 hover:text-primary p-2 rounded-xl hover:bg-primary/10 dark:hover:bg-primary/20 transition-colors inline-flex items-center justify-center">
                                <mat-icon class="text-sm !w-4 !h-4">edit</mat-icon>
                            </button>
                            <button (click)="deleteSkill.emit(skill.id)" title="Delete"
                                [attr.aria-label]="'Delete ' + skill.name"
                                class="text-slate-400 hover:text-danger-textLight dark:hover:text-danger-textDark p-2 rounded-xl hover:bg-danger-bgLight dark:hover:bg-danger-bgDark transition-colors inline-flex items-center justify-center">
                                <mat-icon class="text-sm !w-4 !h-4">delete</mat-icon>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div *ngIf="!loading" class="block md:hidden space-y-4">
        <div *ngFor="let skill of skills"
            class="bg-background-light/50 dark:bg-surface-muted/20 border border-slate-200 dark:border-surface-muted rounded-2xl p-4 space-y-3 shadow-sm">

            <div class="flex justify-between items-start gap-3">
                <div class="min-w-0 flex-1">
                    <h4 class="font-semibold text-sm text-slate-900 dark:text-slate-100 break-words">{{ skill.name }}
                    </h4>
                    <span *ngIf="skill.categoryName"
                        class="inline-block mt-1 text-[9px] font-semibold px-2.5 py-0.5 rounded-full bg-primary/10 border border-primary/20 dark:bg-primary/20 dark:text-primary dark:border-primary/30 uppercase tracking-[0.18em]">
                        {{ skill.categoryName }}
                    </span>
                </div>
                <div
                    class="inline-flex items-center gap-1 shrink-0 bg-surface-light dark:bg-background border border-slate-200 dark:border-surface-muted rounded-xl p-1 shadow-sm">
                    <button (click)="editSkill.emit(skill)" [attr.aria-label]="'Edit ' + skill.name"
                        class="text-slate-400 hover:text-primary p-1.5 rounded-lg hover:bg-primary/10 dark:hover:bg-primary/20 transition-colors inline-flex items-center">
                        <mat-icon class="!w-4 !h-4 text-xs">edit</mat-icon>
                    </button>
                    <button (click)="deleteSkill.emit(skill.id)" [attr.aria-label]="'Delete ' + skill.name"
                        class="text-slate-400 hover:text-danger-textLight dark:hover:text-danger-textDark p-1.5 rounded-lg hover:bg-danger-bgLight dark:hover:bg-danger-bgDark transition-colors inline-flex items-center">
                        <mat-icon class="!w-4 !h-4 text-xs">delete</mat-icon>
                    </button>
                </div>
            </div>

            <div
                class="grid grid-cols-1 gap-2.5 text-xs bg-surface-light dark:bg-background p-3.5 rounded-xl border border-slate-200 dark:border-surface-muted shadow-sm">
                <div>
                    <span
                        class="block text-[9px] font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-[0.18em] mb-0.5">English
                        Sentence</span>
                    <p class="text-slate-600 dark:text-slate-400 break-words whitespace-normal leading-relaxed">
                        {{ skill.sentenceEn || '—' }}
                    </p>
                </div>
                <div class="border-t border-slate-200 dark:border-surface-muted pt-2.5">
                    <span
                        class="block text-[9px] font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-[0.18em] mb-0.5">French
                        Sentence</span>
                    <p class="text-slate-600 dark:text-slate-400 break-words whitespace-normal leading-relaxed">
                        {{ skill.sentenceFr || '—' }}
                    </p>
                </div>
            </div>
        </div>
    </div>

    <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" [loading]="loading"
        (pageChange)="pageChange.emit($event)">
    </app-pagination>
</div>
