<div
    class="p-4 sm:p-6 md:p-8 space-y-6 text-slate-800 dark:text-slate-100 max-w-full mx-auto w-full transition-colors duration-200">

    <!-- ─── HEADER ROW ─── -->
    <div class="border-b border-slate-200 dark:border-surface-muted pb-4">
        <h1 class="text-xl md:text-2xl font-bold tracking-tight
                   text-slate-900 dark:text-white
                   flex items-center gap-2">
            Manage Your Email Templates
        </h1>

        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
            Create, edit, and organize dynamic placeholders for layout parsing.
        </p>
    </div>

    <div class="grid gap-6">

        <!-- Template Form -->
        <app-template-form [isFormVisible]="isFormVisible" [isEditing]="editingTemplateId !== null" [loading]="loading"
            [errorMessage]="errorMessage" [templateData]="newTemplate" [subjectPlaceholder]="subjectPlaceholder"
            (toggle)="onToggleForm()" (formSubmit)="onSubmitTemplate($event)" (cancel)="onCancelEdit()">
        </app-template-form>

        <!-- Template List or Skeleton View -->
        <ng-container *ngIf="loading && (!templates || templates.length === 0); else loadedContent">
            <div
                class="bg-surface-light dark:bg-surface-dark border border-slate-200 dark:border-surface-muted rounded-2xl p-6 shadow-sm space-y-4 animate-fade-in">
                <!-- Smart Skeleton fallback matching list view style -->
                <app-skeleton type="list" [itemsCount]="5"></app-skeleton>
            </div>
        </ng-container>

        <ng-template #loadedContent>
            <!-- Template List -->
            <app-template-list [templates]="templates" [totalElements]="totalElements" [currentPage]="currentPage"
                [totalPages]="totalPages" [loading]="loading" [selectedLanguage]="selectedLanguage"
                [searchTerm]="searchTerm" [editingId]="editingTemplateId"
                (filterChange)="onLanguageFilterChange($event)" (searchChange)="updateSearchTerm($event)"
                (pageChange)="onPageChange($event)" (edit)="onEditClick($event)" (delete)="onDeleteTemplate($event)">
            </app-template-list>
        </ng-template>

        <!-- Delete Modal -->
        <app-delete-popup [isModalOpen]="showDeleteModal" [title]="'Confirm Deletion'" [message]="deleteMessage"
            (confirm)="onConfirmDelete()" (close)="onCancelDelete()" [isLoading]="loading">
        </app-delete-popup>

    </div>

</div>
