<div class="bg-white dark:bg-zinc-900 rounded-lg border border-zinc-200 dark:border-zinc-800 p-5">
    <div class="flex flex-col sm:flex-row sm:items-center gap-3 mb-5">
        <label class="text-sm font-medium text-zinc-600 dark:text-zinc-300 whitespace-nowrap">Application</label>
        <select
            class="text-sm border border-zinc-200 dark:border-zinc-800 rounded-md px-3 py-2 bg-zinc-50 dark:bg-zinc-800 flex-1 focus:outline-none focus:ring-2 focus:ring-violet-500"
            [ngModel]="selectedApplicationId" (ngModelChange)="onSelect($event)"
            [disabled]="loadingApplications || !applications.length">
            <option [ngValue]="null" disabled>
                {{ loadingApplications ? 'Loading applications…' : (applications.length ? 'Choose an application' : 'No
                applications yet') }}
            </option>
            <option *ngFor="let app of applications" [ngValue]="app.id">
                {{ app.companyName || 'Unknown company' }} — {{ app.jobTitle || 'Unknown role' }}
            </option>
        </select>
    </div>

    <p *ngIf="loadingTimeline" class="text-sm text-zinc-400 italic text-center py-8">Loading timeline…</p>

    <p *ngIf="!loadingTimeline && selectedApplicationId && !timeline.length"
        class="text-sm text-zinc-400 italic text-center py-8">
        No events recorded for this application yet.
    </p>

    <p *ngIf="!loadingTimeline && !selectedApplicationId" class="text-sm text-zinc-400 italic text-center py-8">
        Select an application to see how it evolved over time.
    </p>

    <ol *ngIf="!loadingTimeline && timeline.length"
        class="relative border-l border-zinc-200 dark:border-zinc-800 ml-2 space-y-6">
        <li *ngFor="let event of timeline; trackBy: trackByEventId" class="ml-5">
            <span class="absolute -translate-x-1/2 w-2.5 h-2.5 rounded-full mt-1.5 ring-4 ring-white dark:ring-zinc-900"
                [class]="colorClass(event.status)"></span>
            <div class="flex flex-wrap items-baseline gap-x-2">
                <p class="text-sm font-medium text-zinc-800 dark:text-zinc-100">{{ label(event.status) }}</p>
                <p class="text-xs text-zinc-400 dark:text-zinc-500 font-mono tabular-nums">{{ event.occurredAt | date:
                    'MMM d, y, h:mm a' }}</p>
                <p *ngIf="event.daysSincePrevious !== null" class="text-xs text-zinc-400 dark:text-zinc-500">
                    (+{{ event.daysSincePrevious }}d)
                </p>
            </div>
            <p *ngIf="event.note" class="text-xs text-zinc-500 dark:text-zinc-400 mt-1">{{ event.note }}</p>
        </li>
    </ol>
</div>
