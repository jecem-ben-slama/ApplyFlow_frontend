<div
    class="relative bg-surface-light dark:bg-surface rounded-xl border border-slate-200 dark:border-surface-muted p-5 overflow-hidden h-full shadow-sm">
    <span class="absolute top-0 left-0 right-0 h-0.5" [class]="accentClass"></span>

    <div class="flex items-center justify-between gap-3 mb-4">
        <h3 class="text-sm font-semibold text-slate-900 dark:text-slate-50">{{ title }}</h3>
        <span *ngIf="stats.length" class="text-[10px] uppercase tracking-[0.2em] text-slate-400 dark:text-slate-500">
            ranked
        </span>
    </div>

    <p *ngIf="loading" class="text-sm text-slate-400 italic text-center py-8">Loading…</p>

    <ng-container *ngIf="!loading">
        <div *ngIf="stats.length; else empty">
            <div *ngFor="let stat of sortedStats(); let index = index; trackBy: trackByCategory" class="mb-3 last:mb-0"
                [class.opacity-55]="isLowSample(stat)">
                <div class="flex items-center justify-between gap-2 mb-1.5">
                    <div class="flex items-center gap-2 min-w-0">
                        <span
                            class="inline-flex h-5 w-5 items-center justify-center rounded-full bg-slate-100 dark:bg-surface-muted text-[10px] font-semibold text-slate-500 dark:text-slate-300">
                            {{ getRank(index) }}
                        </span>
                        <span class="font-medium text-slate-700 dark:text-slate-200 truncate max-w-[62%]"
                            [class.uppercase]="uppercaseLabels" [title]="stat.categoryName">
                            {{ stat.categoryName }}
                        </span>
                    </div>
                    <span
                        class="font-mono tabular-nums text-[11px] text-slate-500 dark:text-slate-400 whitespace-nowrap">
                        {{ stat.successRatePercentage }}% ({{ stat.successCount }}/{{ stat.totalApplications }})
                    </span>
                </div>
                <div class="w-full bg-slate-100 dark:bg-surface-muted rounded-full h-1.5 overflow-hidden">
                    <div [class]="accentClass" class="h-1.5 rounded-full transition-all duration-500"
                        [style.width.%]="stat.successRatePercentage"></div>
                </div>
                <p *ngIf="isLowSample(stat)" class="mt-1 text-[10px] text-warning-textLight dark:text-warning-textDark">
                    Low sample size — treat this trend as directional only.
                </p>
            </div>
        </div>
        <ng-template #empty>
            <div class="rounded-lg border border-dashed border-slate-200 dark:border-surface-muted p-4 text-center">
                <p class="text-sm font-medium text-slate-700 dark:text-slate-200">No data for this period.</p>
                <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">{{ emptyMessage }}</p>
            </div>
        </ng-template>
    </ng-container>
</div>
