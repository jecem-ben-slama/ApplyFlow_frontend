<p *ngIf="loading" class="text-sm text-zinc-400 italic text-center py-8">Loading board…</p>

<div *ngIf="!loading" class="flex gap-3 overflow-x-auto pb-2">
    <div *ngFor="let status of statusOrder"
        class="min-w-[190px] bg-white dark:bg-zinc-900 rounded-lg border border-zinc-200 dark:border-zinc-800 p-3 flex-shrink-0">
        <div class="flex items-center gap-2 mb-3">
            <span class="h-1.5 w-1.5 rounded-full" [class]="colorClass(status)"></span>
            <span class="text-xs font-semibold text-zinc-700 dark:text-zinc-200 flex-1">{{ label(status) }}</span>
            <span class="font-mono tabular-nums text-[11px] text-zinc-400">{{ column(status).length }}</span>
        </div>
        <div class="space-y-2">
            <div *ngFor="let app of columnCapped(status); trackBy: trackByApp"
                class="relative bg-zinc-50 dark:bg-zinc-800/60 rounded-md pl-3 pr-2.5 py-2 border border-zinc-100 dark:border-zinc-800 overflow-hidden">
                <span class="absolute left-0 top-0 bottom-0 w-0.5" [class]="colorClass(status)"></span>
                <p class="text-sm font-medium text-zinc-800 dark:text-zinc-100 truncate">{{ app.companyName || 'Unknown
                    company' }}</p>
                <p class="text-xs text-zinc-500 dark:text-zinc-400 truncate">{{ app.jobTitle || 'Unknown role' }}</p>
            </div>
            <p *ngIf="column(status).length > cap" class="text-[11px] text-zinc-400 text-center pt-1">
                +{{ column(status).length - cap }} more
            </p>
            <p *ngIf="!column(status).length"
                class="text-[11px] text-zinc-300 dark:text-zinc-600 italic text-center py-4">
                Empty
            </p>
        </div>
    </div>
</div>
