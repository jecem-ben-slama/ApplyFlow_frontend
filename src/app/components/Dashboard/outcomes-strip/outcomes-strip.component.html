<div class="bg-surface-light dark:bg-surface rounded-lg border border-slate-200 dark:border-surface-muted p-5 h-full">
    <h3 class="text-sm font-semibold text-slate-900 dark:text-slate-50 mb-4">Outcomes</h3>
    <div class="space-y-2.5">
        <div *ngFor="let status of statuses"
            class="flex items-center gap-2.5 rounded-md border border-slate-100 dark:border-surface-muted px-3 py-2.5">
            <span class="h-2 w-2 rounded-full flex-shrink-0" [class]="colorClass(status)"></span>
            <p class="text-xs text-slate-500 dark:text-slate-400 flex-1">{{ label(status) }}</p>
            <p class="font-mono tabular-nums text-sm font-semibold text-slate-900 dark:text-slate-50">{{ counts[status]
                ?? 0 }}</p>
        </div>
    </div>
</div>
