<div class="bg-white dark:bg-zinc-900 rounded-lg border border-zinc-200 dark:border-zinc-800 p-5 h-full">
    <h3 class="text-sm font-semibold text-zinc-900 dark:text-zinc-50 mb-4">Outcomes</h3>
    <div class="space-y-2.5">
        <div *ngFor="let status of statuses"
            class="flex items-center gap-2.5 rounded-md border border-zinc-100 dark:border-zinc-800 px-3 py-2.5">
            <span class="h-2 w-2 rounded-full flex-shrink-0" [class]="colorClass(status)"></span>
            <p class="text-xs text-zinc-500 dark:text-zinc-400 flex-1">{{ label(status) }}</p>
            <p class="font-mono tabular-nums text-sm font-semibold text-zinc-900 dark:text-zinc-50">{{ counts[status] ??
                0 }}</p>
        </div>
    </div>
</div>
