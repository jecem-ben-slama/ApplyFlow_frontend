<div class="bg-surface-light dark:bg-surface rounded-lg border border-slate-200 dark:border-surface-muted p-5">
    <div class="flex items-baseline justify-between mb-5">
        <h3 class="text-sm font-semibold text-slate-900 dark:text-slate-50">Application funnel</h3>
        <span class="text-[11px] uppercase tracking-wide text-slate-400 dark:text-slate-500">By status</span>
    </div>

    <p *ngIf="loading" class="text-sm text-slate-400 italic text-center py-8">Loading…</p>

    <ng-container *ngIf="!loading">
        <div *ngIf="stages.length; else empty" class="space-y-4">
            <div *ngFor="let stage of stages; trackBy: trackByStatus" class="flex items-center gap-3">
                <span class="w-1 self-stretch rounded-full" [class]="stage.colorClass"></span>
                <div class="flex-1 min-w-0">
                    <div class="flex justify-between items-baseline text-sm mb-1">
                        <span class="font-medium text-slate-700 dark:text-slate-200">{{ stage.label }}</span>
                        <span class="font-mono tabular-nums text-xs text-slate-500 dark:text-slate-400">
                            {{ stage.count }}
                           
                        </span>
                    </div>
                    <div class="w-full bg-slate-100 dark:bg-surface-muted rounded-full h-1.5 overflow-hidden">
                        <div [class]="stage.colorClass" class="h-1.5 rounded-full transition-all duration-500"
                            [style.width.%]="stage.percentageOfMax"></div>
                    </div>
                </div>
            </div>
        </div>
        <ng-template #empty>
            <p class="text-sm text-slate-400 italic text-center py-8">No funnel data yet.</p>
        </ng-template>
    </ng-container>
</div>
