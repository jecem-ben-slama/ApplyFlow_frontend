<ng-container *ngIf="authService.isAuthenticated$ | async; else showLogin">
  <div class="flex flex-col md:flex-row min-h-screen bg-slate-50 dark:bg-slate-950">
    <app-sidebar></app-sidebar>

    <main class="flex-1 min-w-0 w-full pb-14 md:pb-0">
      <router-outlet></router-outlet>
    </main>
  </div>

  <div *ngIf="isShortcutsOpen" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/40 p-4"
    (click)="closeShortcuts()">
    <section role="dialog" aria-modal="true" aria-labelledby="shortcut-dialog-title"
      class="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl dark:bg-slate-900" (click)="$event.stopPropagation()">
      <div class="flex items-center justify-between gap-4">
        <h2 id="shortcut-dialog-title" class="text-lg font-bold text-slate-900 dark:text-slate-100">Keyboard shortcuts
        </h2>
        <button type="button" aria-label="Close keyboard shortcuts" title="Close" (click)="closeShortcuts()"
          class="rounded-lg p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">&#x2715;</button>
      </div>
      <div class="mt-5 grid grid-cols-[1fr_auto] gap-x-8 gap-y-3 text-sm text-slate-600 dark:text-slate-300">
        <span>Open this guide</span><kbd>?</kbd>
        <span>Focus search</span><kbd>/</kbd>
        <span>Create new</span><kbd>N</kbd>
        <span>Dashboard</span><kbd>D</kbd>
        <span>Applications</span><kbd>A</kbd>
        <span>Attachments</span><kbd>C</kbd>
        <span>Skills</span><kbd>S</kbd>
        <span>Templates</span><kbd>T</kbd>
        <span>Profile</span><kbd>P</kbd>
      </div>
    </section>
  </div>
</ng-container>

<ng-template #showLogin>
  <router-outlet></router-outlet>
</ng-template>
