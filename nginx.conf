worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml;

    # ============================================================
    # Nginx-level rate limiting (coarse first line of defense).
    # Intentionally looser than the Spring Boot interceptor's limits —
    # this exists to blunt obvious floods before they reach the backend
    # at all, not to enforce business rules (that's the interceptor's job).
    # ============================================================
    limit_req_zone $binary_remote_addr zone=general_zone:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=2r/s;
    limit_req_status 429;

    server {
        listen ${PORT};

        server_name _;

        root /usr/share/nginx/html;

        index index.html;


        # ============================================================
        # Runtime configuration
        # ============================================================

        location = /assets/config.json {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            expires -1;
        }


        # ============================================================
        # Static assets
        # ============================================================

        location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
            expires 30d;

            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            access_log off;
        }


        # ============================================================
        # Auth endpoints — tighter Nginx-level throttle, matching the
        # backend interceptor's tighter "auth" bucket group. Placed
        # before the general proxy block so it takes precedence for
        # these specific paths.
        # ============================================================

        location ~ ^/(oauth2|login/oauth2|logout) {

            limit_req zone=auth_zone burst=5 nodelay;

            proxy_pass https://tracker-api-jjme.onrender.com;

            proxy_ssl_server_name on;

            proxy_set_header Host tracker-api-jjme.onrender.com;

            proxy_set_header X-Real-IP $remote_addr;

            # Overwrite rather than append — $proxy_add_x_forwarded_for keeps
            # whatever the client sent and tacks $remote_addr onto the end,
            # so a spoofed client-supplied XFF value survives as the first
            # entry. Setting it to $remote_addr directly discards anything
            # the client sent.
            proxy_set_header X-Forwarded-For $remote_addr;

            proxy_set_header X-Forwarded-Host $host;

            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header X-Forwarded-Port 443;

            proxy_http_version 1.1;

            proxy_buffer_size 128k;

            proxy_buffers 4 256k;

            proxy_busy_buffers_size 256k;

            proxy_redirect https://tracker-api-jjme.onrender.com/ /;

            proxy_cookie_domain tracker-api-jjme.onrender.com $host;
        }


        # ============================================================
        # Spring Boot backend proxy
        # ============================================================

        location ~ ^/(api|actuator) {

            limit_req zone=general_zone burst=20 nodelay;

            proxy_pass https://tracker-api-jjme.onrender.com;

            proxy_ssl_server_name on;

            proxy_set_header Host tracker-api-jjme.onrender.com;

            proxy_set_header X-Real-IP $remote_addr;

            # Same fix as above — overwrite, don't append.
            proxy_set_header X-Forwarded-For $remote_addr;

            proxy_set_header X-Forwarded-Host $host;

            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header X-Forwarded-Port 443;

            proxy_http_version 1.1;

            proxy_buffer_size 128k;

            proxy_buffers 4 256k;

            proxy_busy_buffers_size 256k;

            proxy_redirect https://tracker-api-jjme.onrender.com/ /;

            proxy_cookie_domain tracker-api-jjme.onrender.com $host;
        }


        # ============================================================
        # Angular client-side routing
        # ============================================================

        location / {
            try_files $uri $uri/ /index.html;
        }


        # ============================================================
        # Never cache index.html
        # ============================================================

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            expires -1;
        }


        # ============================================================
        # Security headers (applies to any location above that does
        # NOT declare its own add_header — i.e. the proxy locations
        # and the Angular catch-all)
        # ============================================================

        add_header X-Content-Type-Options "nosniff" always;

        add_header X-Frame-Options "SAMEORIGIN" always;

        add_header Referrer-Policy "strict-origin-when-cross-origin" always;


        # ============================================================
        # Error pages
        # ============================================================

        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}